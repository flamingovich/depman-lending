<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DepMan chip icons</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; }
    h1 { font-size: 18px; margin-bottom: 8px; }
    h2 { font-size: 14px; margin: 24px 0 8px; }
    .panel { padding: 16px; border-radius: 12px; margin-bottom: 8px; }
    .dark { background: #131323; color: #fff; }
    .light { background: #eef0f6; color: #131323; }
    .sizes { display: flex; gap: 16px; align-items: center; margin: 12px 0; }
    .row { display: flex; align-items: center; gap: 6px; font-size: 11px; margin: 4px 0; }
  </style>
</head>
<body>
  <h1>DepMan chip-check icons</h1>
  <p>Оригинальная форма с референса — красная и золотая.</p>

  <div class="panel dark">
    <h2>Red · тёмный фон</h2>
    <div class="sizes">
      <img src="/icons/chip-check-red.svg" width="14" height="14" alt="" />
      <img src="/icons/chip-check-red.svg" width="24" height="24" alt="" />
      <img src="/icons/chip-check-red.svg" width="48" height="48" alt="" />
    </div>
    <div class="row"><img src="/icons/chip-check-red.svg" width="14" height="14" alt="" /> Казино-стримы</div>
    <div class="row"><img src="/icons/chip-check-red.svg" width="14" height="14" alt="" /> Денежные розыгрыши</div>
  </div>

  <div class="panel light">
    <h2>Gold · светлый фон</h2>
    <div class="sizes">
      <img src="/icons/chip-check-gold.svg" width="14" height="14" alt="" />
      <img src="/icons/chip-check-gold.svg" width="24" height="24" alt="" />
      <img src="/icons/chip-check-gold.svg" width="48" height="48" alt="" />
    </div>
    <div class="row"><img src="/icons/chip-check-gold.svg" width="14" height="14" alt="" /> Без верификации</div>
    <div class="row"><img src="/icons/chip-check-gold.svg" width="14" height="14" alt="" /> Быстрые выплаты</div>
  </div>
</body>
</html>
